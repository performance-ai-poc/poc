{{- $mcpServerUrl := .Values.orchestrator.env.mcpServerUrl -}}
{{- $defaultMcpServerUrl := printf "http://%s-mcp-server:%v/mcp" (include "ai-chat.fullname" .) .Values.mcpServer.service.port -}}
{{- $agentLiveCalls := .Values.orchestrator.env.agentLiveCalls | toString | lower -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-chat.fullname" . }}-orchestrator
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  replicas: {{ .Values.orchestrator.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      containers:
        - name: orchestrator

          image: "{{ .Values.orchestrator.image.repository }}:{{ .Values.orchestrator.image.tag }}"
          imagePullPolicy: {{ .Values.orchestrator.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.orchestrator.service.port }}
              protocol: TCP

          env:
            - name: APP_ENV
              value: {{ .Values.orchestrator.env.appEnv | quote }}

            - name: HOST
              value: {{ .Values.orchestrator.env.host | quote }}

            - name: PORT
              value: {{ .Values.orchestrator.env.port | quote }}

            - name: LOG_LEVEL
              value: {{ .Values.orchestrator.env.logLevel | quote }}

            - name: OTEL_SERVICE_NAME
              value: {{ .Values.orchestrator.env.otelServiceName | quote }}

            # Send to the Collector on this pod's own node (DaemonSet hostPort).
            # Export is async, so a down Collector never affects the app.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.orchestrator.env.otelExporterOtlpEndpoint | default "http://$(HOST_IP):4317" | quote }}

            - name: OTEL_TRACES_EXPORTER
              value: "otlp"

            - name: OTEL_METRICS_EXPORTER
              value: "otlp"

            - name: OTEL_LOGS_EXPORTER
              value: "otlp"

            - name: AGENT_LIVE_CALLS
              value: {{ .Values.orchestrator.env.agentLiveCalls | quote }}

            - name: LLM_BASE_URL
              value: {{ .Values.orchestrator.env.llmBaseUrl | quote }}

            {{- if eq $agentLiveCalls "true" }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-chat.fullname" . }}-orchestrator
                  key: LLM_API_KEY
            {{- else }}
            - name: LLM_API_KEY
              value: ""
            {{- end }}

            - name: LLM_MODEL
              value: {{ .Values.orchestrator.env.llmModel | quote }}

            - name: MCP_SERVER_URL
              value: {{ ternary $defaultMcpServerUrl $mcpServerUrl (or (not $mcpServerUrl) (hasPrefix "http://localhost" $mcpServerUrl) (hasPrefix "http://127.0.0.1" $mcpServerUrl)) | quote }}

            - name: DEFAULT_TENANT_ID
              value: {{ .Values.orchestrator.env.defaultTenantId | quote }}

            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.orchestrator.env.corsAllowedOrigins | quote }}
