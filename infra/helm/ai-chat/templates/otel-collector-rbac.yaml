{{- if .Values.otelCollector.enabled }}
# The first RBAC-bearing workload in this chart (docs/OTEL_PLAN.md: "the
# chart has no RBAC at all" before this). Grants exactly get/list/watch on
# pods, namespaces, and nodes (for the k8sattributes processor) plus get on
# nodes/stats (for the kubeletstats receiver) — nothing else. No create,
# update, patch, delete, or exec verb anywhere below, and no Secrets access
# (docs/CONSTRAINTS.md C5). The absence of any write verb makes C10 ("no
# automated remediation") structurally enforced here, not merely promised.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-chat.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-chat.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  # k8sattributes processor: correlates a log/span record with the pod that
  # emitted it (pod metadata, labels, owner references).
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  # kubeletstats receiver: reads the kubelet's /stats/summary endpoint via
  # the API server's node proxy subresource. get only — this is a read of
  # metrics, never a write to node state.
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ai-chat.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ai-chat.fullname" . }}-otel-collector
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-chat.fullname" . }}-otel-collector
    namespace: {{ .Release.Namespace }}
{{- end }}
