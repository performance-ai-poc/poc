apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-chat.fullname" . }}-mcp-server
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  type: {{ .Values.mcpServer.service.type }}

  selector:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.mcpServer.service.port }}
      targetPort: http