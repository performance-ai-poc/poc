{{- if and (.Values.orchestrator.enabled | default true) (.Values.orchestrator.env.agentLiveCalls | toString | lower | eq "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-chat.fullname" . }}-orchestrator
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.orchestrator.env.llmApiKey | quote }}
{{- end }}
