{{- if .Values.analytics.enabled | default true }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-chat.fullname" . }}-analytics
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # Read-only Basic auth header for the OpenObserve query API. Local-only demo
  # default; override in shared environments.
  OPENOBSERVE_AUTH: {{ .Values.analytics.env.openobserveAuth | quote }}
{{- end }}
