{{- if .Values.postgresql.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-chat.fullname" . }}-mcp-seed
  labels:
    app.kubernetes.io/name: mcp-seed
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Seed only on first installation. build_seed.py deliberately recreates
    # the demo tables, so running it on every upgrade would erase persisted
    # changes.
    helm.sh/hook: post-install
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-seed
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: "{{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServer.image.pullPolicy }}
          command:
            - python
            - -m
            - app.seed.build_seed
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-chat.fullname" . }}-postgres
                  key: DATABASE_URL
            - name: READONLY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-chat.fullname" . }}-postgres
                  key: READONLY_DATABASE_URL
{{- end }}
