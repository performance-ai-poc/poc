{{- if .Values.otelCollector.enabled }}
# Kubernetes-adapted Collector config. The processor chain, OTTL mapping
# table, and privacy/allowlist logic are identical in intent to
# otel/collector-config.yaml (the standalone Phase 1-3 config) — kept as a
# separate file because Helm's template engine cannot read files outside the
# chart directory (otel/collector-config.yaml lives at the repo root, not
# under infra/helm/ai-chat/), so the two are maintained in parallel rather
# than one deriving from the other. If you change the redaction rules, the
# mapping table, or the allowlist in one, change it in both — see
# otel/VERIFICATION_STATUS.md for this noted as a known duplication risk.
#
# What's different from the standalone config, and why:
#   - filelog reads the real Kubernetes container log path
#     (/var/log/pods/*/*/*.log) instead of a local bind-mounted dev file.
#   - A `container` operator unwraps the Docker/CRI log envelope and
#     extracts k8s.namespace.name / k8s.pod.name / k8s.pod.uid /
#     k8s.container.name from the log file path, ahead of our own
#     json_parser (documented stanza behavior — see VERIFICATION_STATUS.md,
#     this is the single piece of this whole build least confirmed live).
#   - k8sattributes and kubeletstats are added now that a real cluster
#     exists to query (BUILD_PROMPT.md: both "fail confusingly outside
#     Kubernetes", which is why they were absent through Phase 1-3).
#   - A metrics pipeline exists (kubeletstats' output) alongside logs/traces.
#   - k8sattributes is inserted into the processor chain right after
#     `resource` — i.e. BEFORE attributes/privacy and transform/limits, not
#     appended after BUILD_PROMPT.md's original six. It only ever ADDS
#     resource attributes (pod/namespace/node metadata); it never reads or
#     writes any of the redacted/allowlisted fields, so its position
#     relative to the redaction stage doesn't weaken C3/C4 — placing all
#     enrichment (resource, k8sattributes) before all redaction/allowlisting
#     (attributes/privacy, transform/limits) keeps that boundary legible.
#     The six original processors keep their relative order unchanged.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-chat.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # Self-monitoring (Acceptance A13) — same as otel/collector-config.yaml.
      prometheus:
        config:
          scrape_configs:
            - job_name: otelcol-self
              scrape_interval: 15s
              static_configs:
                - targets: ["0.0.0.0:8888"]

      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          # Do not ingest this Collector's own pod logs as if they were
          # application telemetry.
          - /var/log/pods/*_*-otel-collector-*/otel-collector/*.log
        start_at: end
        # Persist read offsets in the bounded file_storage extension
        # (/var/lib/otelcol) so a Collector pod restart resumes where it left
        # off instead of re-reading the node's logs from start_at. Matches the
        # v2 design's filelog config.
        storage: file_storage
        include_file_path: true
        operators:
          - type: container
          - type: json_parser
            parse_from: body
            parse_to: attributes
            on_error: send
            timestamp:
              parse_from: attributes.timestamp
              layout: '%Y-%m-%dT%H:%M:%S.%f%z'
          - type: remove
            field: attributes.timestamp
            on_error: send

      kubeletstats:
        collection_interval: 20s
        auth_type: serviceAccount
        endpoint: "${env:NODE_NAME}:10250"
        insecure_skip_verify: true
        metric_groups: [pod, node]

      # Node/process host metrics (v2 design section 9's required MVP
      # receiver). Reads the host's /proc and /sys via root_path=/hostfs; the
      # DaemonSet mounts exactly those two paths read-only under /hostfs
      # (otel-collector-daemonset.yaml), NOT the whole host root — narrowest
      # paths per docs/CONSTRAINTS.md C5.
      #
      # Scraper set deliberately limited to the ones that read cleanly from
      # /proc + /sys alone: cpu, memory, load, network, process. disk and
      # filesystem are omitted on purpose — they need broader host-mount
      # visibility (real mountpoints) than C5's narrowest-path rule allows
      # here. Flip that trade-off by mounting host / -> /hostfs:ro and adding
      # the disk/filesystem scrapers, if a demo needs host disk metrics.
      hostmetrics:
        collection_interval: 20s
        root_path: /hostfs
        scrapers:
          cpu: {}
          memory: {}
          load: {}
          network: {}
          process: {}

    processors:
      memory_limiter:
        check_interval: 1s
        # limit_mib ~80% and spike_limit_mib ~20% of the container's hard
        # memory limit (values.yaml otelCollector.resources.limits.memory),
        # so the limiter sheds load before the kubelet OOM-kills the
        # container. Nested calls (not piped) because Sprig's `div a b` is
        # a/b, and piping puts the incoming value in the LAST argument slot
        # — `X | div 10` would compute 10/X, not X/10.
        limit_mib: {{ div (mul (int (trimSuffix "Mi" .Values.otelCollector.resources.limits.memory)) 8) 10 }}
        spike_limit_mib: {{ div (mul (int (trimSuffix "Mi" .Values.otelCollector.resources.limits.memory)) 2) 10 }}

      resource:
        attributes:
          - key: deployment.environment
            value: {{ .Values.otelCollector.deploymentEnvironment | default "kubernetes" | quote }}
          - key: collector.name
            value: ai-chat-poc-otel-collector
            action: upsert

      # k8sattributes: correlates every record with the pod that produced it.
      # pod_association tries resource-attribute-based association first
      # (k8s.pod.uid, set by the filelog receiver's `container` operator
      # above from the log file path), then falls back to the source
      # connection's IP (useful for anything sent directly over OTLP by a
      # pod on this node, once the orchestrator team's SDK work lands —
      # otel/HANDOFF.md).
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.uid
            - k8s.deployment.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      # Same named-field denylist as otel/collector-config.yaml. content
      # attributes are gated in transform/limits below, same reasoning.
      attributes/privacy:
        actions:
          - key: gen_ai.system_instructions
            action: delete
          - key: http.request.header.authorization
            action: delete
          - key: http.request.header.cookie
            action: delete
          - key: api_key
            action: delete
          # Raw SQL from psycopg auto-instrumentation + full outbound URLs from
          # httpx auto-instrumentation. See otel/collector-config.yaml for the
          # rationale — this is the key redaction the combined design adds.
          - key: db.statement
            action: delete
          - key: db.query.text
            action: delete
          - key: url.full
            action: delete
          - key: url.query
            action: delete
          - key: user.email
            action: hash
          - key: user.id
            action: hash
          - key: session.id
            action: hash

      # SINGLE MAPPING TABLE — see otel/collector-config.yaml for the full
      # commented table (docs/SEMCONV.md section 3). Reproduced in the OTTL
      # below without repeating the prose comments, to keep this ConfigMap a
      # manageable size; the standalone file is the one to read for the
      # human-readable version of this table.
      transform/limits:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["capture.mode"], "${env:CAPTURE_MODE}")
              - delete_key(attributes, "gen_ai.input.messages") where attributes["capture.mode"] != "content-approved"
              - delete_key(attributes, "gen_ai.output.messages") where attributes["capture.mode"] != "content-approved"
              # Normalize app.<id> -> bare so spans and logs correlate on the
              # same field. See otel/collector-config.yaml for the full rationale.
              - set(attributes["run_id"], attributes["app.run_id"]) where attributes["app.run_id"] != nil
              - set(attributes["request_id"], attributes["app.request_id"]) where attributes["app.request_id"] != nil
              - set(attributes["session_id"], attributes["app.session_id"]) where attributes["app.session_id"] != nil
              - set(attributes["tenant_id"], attributes["app.tenant_id"]) where attributes["app.tenant_id"] != nil
              - set(attributes["correlation.confidence"], "high") where attributes["run_id"] != nil
              - keep_keys(attributes, ["run_id", "request_id", "session_id", "tenant_id",
                  "gen_ai.conversation.id",
                  "gen_ai.operation.name", "gen_ai.agent.name", "gen_ai.provider.name",
                  "gen_ai.request.model", "gen_ai.response.model",
                  "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens",
                  "gen_ai.tool.name", "gen_ai.tool.type", "gen_ai.data_source.id",
                  "gen_ai.workflow.name",
                  "app.outcome", "app.latency_ms", "app.call.type", "app.retryable",
                  "app.failure.category", "app.agent.step.sequence",
                  "app.agent.call.sequence", "app.retry.attempt", "app.tool.args_digest",
                  "error.type",
                  "http.request.method", "http.route", "http.response.status_code",
                  "url.scheme", "url.path", "server.address", "server.port",
                  "network.protocol.version", "client.address",
                  "db.system", "db.system.name", "db.namespace", "db.operation.name",
                  "db.collection.name",
                  "capture.mode", "correlation.confidence",
                  "gen_ai.input.messages", "gen_ai.output.messages"])
              - truncate_all(attributes, 4096)
        log_statements:
          - context: log
            statements:
              - set(attributes["capture.mode"], "${env:CAPTURE_MODE}")
              - delete_key(attributes, "gen_ai.input.messages") where attributes["capture.mode"] != "content-approved"
              - delete_key(attributes, "gen_ai.output.messages") where attributes["capture.mode"] != "content-approved"
              - set(attributes["gen_ai.agent.name"], attributes["agent"]) where attributes["agent"] != nil
              - set(attributes["error.type"], attributes["error_type"]) where attributes["error_type"] != nil
              - set(attributes["gen_ai.request.model"], attributes["model_id"]) where attributes["model_id"] != nil
              - set(attributes["gen_ai.usage.input_tokens"], attributes["input_tokens"]) where attributes["input_tokens"] != nil
              - set(attributes["gen_ai.usage.output_tokens"], attributes["output_tokens"]) where attributes["output_tokens"] != nil
              - set(attributes["gen_ai.tool.name"], attributes["tool_name"]) where attributes["tool_name"] != nil
              - set(attributes["gen_ai.operation.name"], "invoke_agent") where IsMatch(attributes["event"], "^agent\\.step_")
              - set(attributes["gen_ai.operation.name"], "chat") where attributes["event"] == "agent.llm_call"
              - set(attributes["gen_ai.operation.name"], "execute_tool") where IsMatch(attributes["event"], "^agent\\.(tool_selected|tool_returned|retried)$")
              - set(attributes["gen_ai.tool.type"], "mcp") where IsMatch(attributes["event"], "^agent\\.(tool_selected|tool_returned|retried)$")
              - set(attributes["http.route"], attributes["endpoint"]) where IsMatch(attributes["event"], "^api\\.request\\.")
              - set(attributes["http.response.status_code"], attributes["status_code"]) where IsMatch(attributes["event"], "^api\\.request\\.")
              - keep_keys(attributes, ["run_id", "request_id", "session_id", "tenant_id",
                  "service.name", "event", "graph.node", "step.sequence", "call.sequence",
                  "instruction_digest", "args_digest", "attempt", "retry.attempt",
                  "status_code", "row_count", "exec_ms", "count", "endpoint_count",
                  "retrieval_ids", "retryable", "duration_ms", "latency_ms", "status", "reason",
                  "gen_ai.agent.name", "error.type", "gen_ai.request.model",
                  "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens",
                  "gen_ai.tool.name", "gen_ai.operation.name", "gen_ai.tool.type",
                  "http.route", "http.response.status_code",
                  "route.reason_code", "gen_ai.provider.name",
                  "capture.mode", "correlation.confidence",
                  "gen_ai.input.messages", "gen_ai.output.messages"])
              - truncate_all(attributes, 4096)
              - set(attributes["correlation.confidence"], "medium") where attributes["run_id"] != nil and attributes["correlation.confidence"] == nil

      filter/noise:
        error_mode: ignore
        logs:
          log_record:
            - 'attributes["event"] == nil'
        traces:
          span:
            - 'name == ""'

      batch:
        timeout: 3s
        send_batch_size: 512
        send_batch_max_size: 1024

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol
        timeout: 1s

    exporters:
      otlphttp:
        # Default to the in-cluster OpenObserve service unless an external
        # endpoint is set in values. OpenObserve's OTLP path is /api/<org>;
        # the otlphttp exporter appends the per-signal suffix.
        {{- $ooBase := .Values.otelCollector.openobserve.endpoint | default (printf "http://%s-openobserve:%v" (include "ai-chat.fullname" .) .Values.openObserve.service.port) }}
        endpoint: {{ printf "%s/api/%s" $ooBase .Values.otelCollector.openobserve.org | quote }}
        headers:
          Authorization: ${env:OPENOBSERVE_AUTH_HEADER}
        sending_queue:
          enabled: true
          queue_size: 5000
          storage: file_storage
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 120s

    service:
      extensions: [health_check, file_storage]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, k8sattributes, attributes/privacy, transform/limits, filter/noise, batch]
          exporters: [otlphttp]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, resource, k8sattributes, attributes/privacy, transform/limits, filter/noise, batch]
          exporters: [otlphttp]
        metrics:
          # hostmetrics (node/process, v2 section 9) + kubeletstats (pod/node)
          # + prometheus (Collector self-monitoring, A13). k8sattributes is
          # harmless for the Collector's own self-metrics; kept uniform with
          # the other two pipelines rather than special-cased out.
          receivers: [hostmetrics, kubeletstats, prometheus]
          processors: [memory_limiter, resource, k8sattributes, batch]
          exporters: [otlphttp]
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888
{{- end }}
