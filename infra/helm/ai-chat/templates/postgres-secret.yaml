{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-chat.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.appUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.appPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:%v/%s" .Values.postgresql.auth.appUser .Values.postgresql.auth.appPassword (include "ai-chat.fullname" .) .Values.postgresql.service.port .Values.postgresql.auth.database | quote }}
  READONLY_DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:%v/%s" .Values.postgresql.auth.readonlyUser .Values.postgresql.auth.readonlyPassword (include "ai-chat.fullname" .) .Values.postgresql.service.port .Values.postgresql.auth.database | quote }}
{{- end }}
