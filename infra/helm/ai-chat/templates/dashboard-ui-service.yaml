apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-chat.fullname" . }}-dashboard-ui
  labels:
    app.kubernetes.io/name: dashboard-ui
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  type: {{ .Values.dashboardUi.service.type }}

  selector:
    app.kubernetes.io/name: dashboard-ui
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.dashboardUi.service.port }}
      targetPort: http

      {{- if and
          (eq .Values.dashboardUi.service.type "NodePort")
          .Values.dashboardUi.service.nodePort
      }}
      nodePort: {{ .Values.dashboardUi.service.nodePort }}
      {{- end }}