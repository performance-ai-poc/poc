{{- if .Values.customerUi.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ai-chat.fullname" . }}-customer-ui
  labels:
    app.kubernetes.io/name: customer-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if .Values.customerUi.ingress.className }}
  ingressClassName: {{ .Values.customerUi.ingress.className | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.customerUi.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.customerUi.ingress.path | quote }}
            pathType: {{ .Values.customerUi.ingress.pathType | quote }}
            backend:
              service:
                name: {{ include "ai-chat.fullname" . }}-customer-ui
                port:
                  number: {{ .Values.customerUi.service.port }}
  {{- if and .Values.customerUi.ingress.tls.enabled .Values.customerUi.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ .Values.customerUi.ingress.host | quote }}
      secretName: {{ .Values.customerUi.ingress.tls.secretName | quote }}
  {{- end }}
{{- end }}
