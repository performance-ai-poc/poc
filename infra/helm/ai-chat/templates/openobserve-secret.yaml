{{- if .Values.openObserve.enabled }}
# Root credentials for the in-cluster OpenObserve backend. Local-only demo
# values from values.yaml (same posture as postgres-secret.yaml); override for
# any shared environment.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-chat.fullname" . }}-openobserve
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  ZO_ROOT_USER_EMAIL: {{ .Values.openObserve.auth.rootEmail | quote }}
  ZO_ROOT_USER_PASSWORD: {{ .Values.openObserve.auth.rootPassword | quote }}
{{- end }}
