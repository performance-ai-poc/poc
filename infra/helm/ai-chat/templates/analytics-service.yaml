{{- if .Values.analytics.enabled | default true }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-chat.fullname" . }}-analytics
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  type: {{ .Values.analytics.service.type }}

  selector:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.analytics.service.port }}
      targetPort: http

      {{- if and
          (eq .Values.analytics.service.type "NodePort")
          .Values.analytics.service.nodePort
      }}
      nodePort: {{ .Values.analytics.service.nodePort }}
      {{- end }}
{{- end }}
