apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-chat.fullname" . }}-mcp-server
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  replicas: {{ .Values.mcpServer.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      containers:
        - name: mcp-server

          image: "{{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServer.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.mcpServer.service.port }}
              protocol: TCP

          env:
            {{- if .Values.postgresql.enabled }}
            # Runtime database tools receive only the read-only DSN. The
            # read-write DSN is restricted to the one-time seed Job.
            - name: READONLY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-chat.fullname" . }}-postgres
                  key: READONLY_DATABASE_URL
            {{- end }}
            - name: STATEMENT_TIMEOUT_MS
              value: {{ .Values.mcpServer.env.statementTimeoutMs | quote }}
            - name: MOCK_TOOL_LATENCY_MS
              value: {{ .Values.mcpServer.env.mockToolLatencyMs | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.mcpServer.env.logLevel | quote }}
