{{- if .Values.otelCollector.enabled }}
# Mirrors the chart's existing Secret pattern (postgres-secret.yaml,
# orchestrator-secret.yaml): values.yaml's plaintext default is the same
# "local POC posture, override for a shared environment" stance the rest of
# this chart already takes (see infra/helm/ai-chat/README.md's note on
# postgresql.auth.*). This Collector never reads Kubernetes Secrets other
# than its own (no Secrets API permission is granted in
# otel-collector-rbac.yaml's ClusterRole — this Secret is projected as an
# env var by the DaemonSet, not fetched by the Collector via the API).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-chat.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # Use an explicit override if given; otherwise derive a Basic auth header
  # from the in-cluster OpenObserve root credentials
  # (Basic base64("<email>:<password>")). This is what lets the whole stack
  # come up self-contained with no manual credential wiring.
  {{- if .Values.otelCollector.openobserve.authHeader }}
  OPENOBSERVE_AUTH_HEADER: {{ .Values.otelCollector.openobserve.authHeader | quote }}
  {{- else }}
  OPENOBSERVE_AUTH_HEADER: {{ printf "Basic %s" (printf "%s:%s" .Values.openObserve.auth.rootEmail .Values.openObserve.auth.rootPassword | b64enc) | quote }}
  {{- end }}
{{- end }}
