nameOverride: ""
fullnameOverride: ""

customerUi:
  replicaCount: 1

  image:
    repository: customer-ui
    tag: demo
    pullPolicy: Never

  service:
    type: NodePort
    port: 80
    nodePort: 30080

  ingress:
    enabled: true
    className: nginx
    host: customer.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ""

orchestrator:
  replicaCount: 1

  image:
    repository: orchestrator-svc
    tag: demo
    pullPolicy: Never

  service:
    type: NodePort
    port: 8001
    nodePort: 30081

  env:
    appEnv: production
    host: 0.0.0.0
    port: "8001"
    logLevel: INFO
    agentLiveCalls: "false"
    llmBaseUrl: https://openai.rc.asu.edu/v1
    llmApiKey: ""
    llmModel: qwen3-coder-30b-a3b-instruct
    mcpServerUrl: ""
    defaultTenantId: default-tenant
    corsAllowedOrigins: "*"
    otelExporterOtlpEndpoint: ""
    otelServiceName: orchestrator-svc

mcpServer:
  replicaCount: 1

  image:
    repository: mcp-server
    tag: demo
    pullPolicy: Never

  service:
    type: ClusterIP
    port: 8000

  env:
    statementTimeoutMs: "3000"
    mockToolLatencyMs: "0"
    logLevel: INFO
    otelExporterOtlpEndpoint: ""
    otelServiceName: mcp-server

# OTel Collector — one per node (DaemonSet), the hardened telemetry plane.
# Receives real OTLP spans/metrics/logs from the instrumented app AND tails
# stdout via filelog, runs redaction + capture-policy + allowlist, and exports
# to the in-cluster OpenObserve below. First workload in this chart with RBAC,
# resource limits, and a security context.
otelCollector:
  enabled: true

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.153.0"
    pullPolicy: IfNotPresent

  # otel/policy/{metadata-only,content-approved}.yaml. metadata-only deletes
  # gen_ai.input/output.messages before export; content-approved permits them.
  captureMode: metadata-only

  deploymentEnvironment: kubernetes

  resources:
    requests:
      cpu: 150m
      memory: 224Mi
    limits:
      cpu: 500m
      memory: 512Mi

  queue:
    sizeLimit: 1Gi

  openobserve:
    # Empty -> defaults to the in-cluster OpenObserve service below. Override
    # to export to an external OpenObserve/OTLP backend instead.
    endpoint: ""
    org: default
    # Empty -> derived from openObserve.auth below. Override for an external
    # backend with its own credentials.
    authHeader: ""

openObserve:
  enabled: true

  image:
    repository: public.ecr.aws/zinclabs/openobserve
    tag: "v0.14.1"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 5080
    nodePort: 30083

  auth:
    rootEmail: admin@example-test.invalid
    rootPassword: otel-poc-local-only

  persistence:
    size: 2Gi
    storageClass: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

postgresql:
  enabled: true

  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  service:
    port: 5432

  auth:
    # Local POC defaults matching docker-compose.yml. Override these values for
    # any shared environment; do not use committed passwords in production.
    database: appdb
    appUser: app
    appPassword: app
    readonlyUser: mcp_readonly
    readonlyPassword: mcp_readonly

  persistence:
    size: 2Gi
    storageClass: ""

  resources: {}

dashboardUi:
  replicaCount: 1

  image:
    repository: dashboard-ui
    tag: demo
    pullPolicy: Never

  service:
    type: NodePort
    port: 80
    nodePort: 30082
