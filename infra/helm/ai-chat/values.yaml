nameOverride: ""
fullnameOverride: ""

customerUi:
  replicaCount: 1

  image:
    repository: customer-ui
    tag: demo
    pullPolicy: Never

  service:
    type: NodePort
    port: 80
    nodePort: 30080

  ingress:
    enabled: true
    className: nginx
    host: customer.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ""

orchestrator:
  replicaCount: 1

  image:
    repository: orchestrator-svc
    tag: demo
    pullPolicy: Never

  service:
    type: NodePort
    port: 8001
    nodePort: 30081

  env:
    appEnv: production
    host: 0.0.0.0
    port: "8001"
    logLevel: INFO
    agentLiveCalls: "false"
    llmBaseUrl: https://openai.rc.asu.edu/v1
    llmApiKey: ""
    llmModel: qwen3-coder-30b-a3b-instruct
    mcpServerUrl: ""
    defaultTenantId: default-tenant
    corsAllowedOrigins: "*"
    otelExporterOtlpEndpoint: ""
    otelServiceName: orchestrator-svc

mcpServer:
  replicaCount: 1

  image:
    repository: mcp-server
    tag: demo
    pullPolicy: Never

  service:
    type: ClusterIP
    port: 8000

  env:
    statementTimeoutMs: "3000"
    mockToolLatencyMs: "0"
    logLevel: INFO
    otelExporterOtlpEndpoint: ""
    otelServiceName: mcp-server

postgresql:
  enabled: true

  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  service:
    port: 5432

  auth:
    # Local POC defaults matching docker-compose.yml. Override these values for
    # any shared environment; do not use committed passwords in production.
    database: appdb
    appUser: app
    appPassword: app
    readonlyUser: mcp_readonly
    readonlyPassword: mcp_readonly

  persistence:
    size: 2Gi
    storageClass: ""

  resources: {}
