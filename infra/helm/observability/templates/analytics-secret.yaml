{{- if .Values.analytics.enabled | default true }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observability.fullname" . }}-analytics
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  OPENOBSERVE_AUTH: {{ .Values.analytics.env.openobserveAuth | default (printf "Basic %s" (printf "%s:%s" .Values.openObserve.auth.rootEmail .Values.openObserve.auth.rootPassword | b64enc)) | quote }}
{{- end }}
