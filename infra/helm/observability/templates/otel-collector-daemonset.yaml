{{- if .Values.otelCollector.enabled }}
# One Collector per node. Runs non-root with all capabilities dropped and only
# read-only host mounts; the one writable path is a bounded emptyDir.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "observability.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Roll the pods when the config changes (the Collector does not
        # hot-reload).
        checksum/config: {{ include (print $.Template.BasePath "/otel-collector-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "observability.fullname" . }}-otel-collector
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: otel-collector
          image: "{{ .Values.otelCollector.image.repository }}:{{ .Values.otelCollector.image.tag }}"
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          args:
            - "--config=/etc/otelcol/collector-config.yaml"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CAPTURE_MODE
              value: {{ .Values.otelCollector.captureMode | quote }}
            - name: OPENOBSERVE_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: {{ include "observability.fullname" . }}-otel-collector
                  key: OPENOBSERVE_AUTH_HEADER
          ports:
            # hostPort so each pod reaches the Collector on its own node.
            - name: otlp-grpc
              containerPort: 4317
              hostPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              hostPort: 4318
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.otelCollector.resources.requests.cpu }}
              memory: {{ .Values.otelCollector.resources.requests.memory }}
            limits:
              cpu: {{ .Values.otelCollector.resources.limits.cpu }}
              memory: {{ .Values.otelCollector.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            # Host /proc and /sys for the hostmetrics receiver (root_path /hostfs).
            # Observability dix update
            ########################################
            - name: hostfs-root
              mountPath: /hostfs
              readOnly: true
            ########################################
            - name: hostfs-proc
              mountPath: /hostfs/proc
              readOnly: true
            - name: hostfs-sys
              mountPath: /hostfs/sys
              readOnly: true
            - name: otelcol-storage
              mountPath: /var/lib/otelcol
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "observability.fullname" . }}-otel-collector
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: DirectoryOrCreate

        # Observability dix update
        ########################################
        - name: hostfs-root
          hostPath:
            path: /
            type: Directory
        
        ########################################
        - name: hostfs-proc
          hostPath:
            path: /proc
            type: Directory
        - name: hostfs-sys
          hostPath:
            path: /sys
            type: Directory
        - name: otelcol-storage
          emptyDir:
            sizeLimit: {{ .Values.otelCollector.queue.sizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
