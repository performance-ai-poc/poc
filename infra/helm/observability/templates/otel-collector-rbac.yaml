{{- if .Values.otelCollector.enabled }}
# Read-only access for the Collector: get/list/watch on pods, namespaces, and
# nodes (k8sattributes) plus get on nodes/stats (kubeletstats). No write verbs,
# no Secrets access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "observability.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "observability.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  # k8sattributes processor: correlates a log/span record with the pod that
  # emitted it (pod metadata, labels, owner references).
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  # kubeletstats receiver: reads the kubelet's /stats/summary endpoint via
  # the API server's node proxy subresource. get only — this is a read of
  # metrics, never a write to node state.
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "observability.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "observability.fullname" . }}-otel-collector
subjects:
  - kind: ServiceAccount
    name: {{ include "observability.fullname" . }}-otel-collector
    namespace: {{ .Release.Namespace }}
{{- end }}
