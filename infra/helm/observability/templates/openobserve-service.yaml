{{- if .Values.openObserve.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability.fullname" . }}-openobserve
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.openObserve.service.type }}
  selector:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.openObserve.service.port }}
      targetPort: http
      {{- if and (eq .Values.openObserve.service.type "NodePort") .Values.openObserve.service.nodePort }}
      nodePort: {{ .Values.openObserve.service.nodePort }}
      {{- end }}
{{- end }}
