{{- if .Values.otelCollector.enabled }}
# Kubernetes Collector config. Same processor chain and redaction/allowlist
# logic as otel/collector-config.yaml (kept in parallel because Helm can't read
# files outside the chart dir), plus filelog reading /var/log/pods, k8sattributes
# for pod metadata, and hostmetrics/kubeletstats. Change the redaction or
# allowlist here and in otel/collector-config.yaml together.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability.fullname" . }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: otelcol-self
              scrape_interval: 15s
              static_configs:
                - targets: ["0.0.0.0:8888"]

      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          # Do not ingest this Collector's own pod logs as if they were
          # application telemetry.
          - /var/log/pods/*_*-otel-collector-*/otel-collector/*.log
        start_at: end
        # Persist read offsets so a restart resumes where it left off.
        storage: file_storage
        include_file_path: true
        operators:
          - type: container
          - type: json_parser
            parse_from: body
            parse_to: attributes
            on_error: send
            timestamp:
              parse_from: attributes.timestamp
              layout: '%Y-%m-%dT%H:%M:%S.%f%z'
          - type: remove
            field: attributes.timestamp
            on_error: send

      kubeletstats:
        collection_interval: 20s
        auth_type: serviceAccount
        endpoint: "${env:NODE_NAME}:10250"
        insecure_skip_verify: true
        metric_groups: [pod, node]

      # Node/process host metrics from the host's /proc and /sys (mounted
      # read-only under /hostfs). Keep the scrapers to node-level signals that
      # are stable in this minikube setup; the process scraper is noisy here
      # because /hostfs/proc access is restricted for some kernel entries.
      hostmetrics:
        collection_interval: 20s
        root_path: /hostfs
        scrapers:
          cpu: {}
          memory: {}
          filesystem: {}
          load: {}
          network: {}

    processors:
      memory_limiter:
        check_interval: 1s
        # ~80% / ~20% of the container memory limit.
        limit_mib: {{ div (mul (int (trimSuffix "Mi" .Values.otelCollector.resources.limits.memory)) 8) 10 }}
        spike_limit_mib: {{ div (mul (int (trimSuffix "Mi" .Values.otelCollector.resources.limits.memory)) 2) 10 }}

      resource:
        attributes:
          - key: deployment.environment
            value: {{ .Values.otelCollector.deploymentEnvironment | default "kubernetes" | quote }}
            action: upsert
          - key: collector.name
            value: ai-chat-poc-otel-collector
            action: upsert

      # Correlate each record with the pod that produced it (by pod uid from
      # the log path, else the source connection).
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.uid
            - k8s.deployment.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      # Drop known-sensitive fields (content messages are gated below).
      attributes/privacy:
        actions:
          - key: gen_ai.system_instructions
            action: delete
          - key: http.request.header.authorization
            action: delete
          - key: http.request.header.cookie
            action: delete
          - key: api_key
            action: delete
          # Raw SQL and full outbound URLs from the auto-instrumentation.
          - key: db.statement
            action: delete
          - key: db.query.text
            action: delete
          - key: url.full
            action: delete
          - key: url.query
            action: delete
          - key: http.url
            action: delete
          - key: http.target
            action: delete
          - key: user.email
            action: hash
          - key: user.id
            action: hash
          - key: session.id
            action: hash

      # Capture policy, field mapping, and the allowlist.
      transform/limits:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["capture.mode"], "${env:CAPTURE_MODE}")
              - delete_key(attributes, "gen_ai.input.messages") where attributes["capture.mode"] != "content-approved"
              - delete_key(attributes, "gen_ai.output.messages") where attributes["capture.mode"] != "content-approved"
              # Normalize app.<id> to bare so spans and logs correlate.
              - set(attributes["run_id"], attributes["app.run_id"]) where attributes["app.run_id"] != nil
              - set(attributes["request_id"], attributes["app.request_id"]) where attributes["app.request_id"] != nil
              - set(attributes["session_id"], attributes["app.session_id"]) where attributes["app.session_id"] != nil
              - set(attributes["tenant_id"], attributes["app.tenant_id"]) where attributes["app.tenant_id"] != nil
              - set(attributes["correlation.confidence"], "high") where attributes["run_id"] != nil
              - keep_keys(attributes, ["run_id", "request_id", "session_id", "tenant_id",
                  "gen_ai.conversation.id",
                  "gen_ai.operation.name", "gen_ai.agent.name", "gen_ai.provider.name",
                  "gen_ai.request.model", "gen_ai.response.model",
                  "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens",
                  "gen_ai.tool.name", "gen_ai.tool.type", "gen_ai.data_source.id",
                  "gen_ai.workflow.name",
                  "app.outcome", "app.latency_ms", "app.call.type", "app.retryable",
                  "app.failure.category", "app.agent.step.sequence",
                  "app.agent.call.sequence", "app.retry.attempt", "app.tool.args_digest",
                  "error.type",
                  "http.request.method", "http.route", "http.response.status_code",
                  "url.scheme", "url.path", "server.address", "server.port",
                  "network.protocol.version", "client.address",
                  "http.method", "http.status_code", "http.host", "http.scheme",
                  "http.user_agent", "http.flavor", "http.server_name",
                  "net.host.port", "net.peer.ip", "net.peer.port", "asgi.event.type",
                  "db.system", "db.system.name", "db.namespace", "db.operation.name",
                  "db.collection.name",
                  "capture.mode", "correlation.confidence",
                  "gen_ai.input.messages", "gen_ai.output.messages"])
              - truncate_all(attributes, 4096)
        log_statements:
          - context: log
            statements:
              - set(attributes["capture.mode"], "${env:CAPTURE_MODE}")
              - delete_key(attributes, "gen_ai.input.messages") where attributes["capture.mode"] != "content-approved"
              - delete_key(attributes, "gen_ai.output.messages") where attributes["capture.mode"] != "content-approved"
              - set(attributes["gen_ai.agent.name"], attributes["agent"]) where attributes["agent"] != nil
              - set(attributes["error.type"], attributes["error_type"]) where attributes["error_type"] != nil
              - set(attributes["gen_ai.request.model"], attributes["model_id"]) where attributes["model_id"] != nil
              - set(attributes["gen_ai.usage.input_tokens"], attributes["input_tokens"]) where attributes["input_tokens"] != nil
              - set(attributes["gen_ai.usage.output_tokens"], attributes["output_tokens"]) where attributes["output_tokens"] != nil
              - set(attributes["gen_ai.tool.name"], attributes["tool_name"]) where attributes["tool_name"] != nil
              - set(attributes["gen_ai.operation.name"], "invoke_agent") where IsMatch(attributes["event"], "^agent\\.step_")
              - set(attributes["gen_ai.operation.name"], "chat") where attributes["event"] == "agent.llm_call"
              - set(attributes["gen_ai.operation.name"], "execute_tool") where IsMatch(attributes["event"], "^agent\\.(tool_selected|tool_returned|retried)$")
              - set(attributes["gen_ai.tool.type"], "mcp") where IsMatch(attributes["event"], "^agent\\.(tool_selected|tool_returned|retried)$")
              - set(attributes["http.route"], attributes["endpoint"]) where IsMatch(attributes["event"], "^api\\.request\\.")
              - set(attributes["http.response.status_code"], attributes["status_code"]) where IsMatch(attributes["event"], "^api\\.request\\.")
              - keep_keys(attributes, ["run_id", "request_id", "session_id", "tenant_id",
                  "service.name", "event", "graph.node", "step.sequence", "call.sequence",
                  "instruction_digest", "args_digest", "attempt", "retry.attempt",
                  "status_code", "row_count", "exec_ms", "count", "endpoint_count",
                  "retrieval_ids", "retryable", "duration_ms", "latency_ms", "status", "reason",
                  "gen_ai.agent.name", "error.type", "gen_ai.request.model",
                  "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens",
                  "gen_ai.tool.name", "gen_ai.operation.name", "gen_ai.tool.type",
                  "http.route", "http.response.status_code",
                  "route.reason_code", "gen_ai.provider.name",
                  "capture.mode", "correlation.confidence",
                  "gen_ai.input.messages", "gen_ai.output.messages"])
              - truncate_all(attributes, 4096)
              - set(attributes["correlation.confidence"], "medium") where attributes["run_id"] != nil and attributes["correlation.confidence"] == nil

      filter/noise:
        error_mode: ignore
        logs:
          log_record:
            - 'attributes["event"] == nil'
        traces:
          span:
            - 'name == ""'

      batch:
        timeout: 3s
        send_batch_size: 512
        send_batch_max_size: 1024

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol
        timeout: 1s

    exporters:
      otlphttp:
        {{- $ooBase := .Values.otelCollector.openobserve.endpoint | default (printf "http://%s-openobserve:%v" (include "observability.fullname" .) .Values.openObserve.service.port) }}
        endpoint: {{ printf "%s/api/%s" $ooBase .Values.otelCollector.openobserve.org | quote }}
        headers:
          Authorization: ${env:OPENOBSERVE_AUTH_HEADER}
        sending_queue:
          enabled: true
          queue_size: 5000
          storage: file_storage
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 120s

    service:
      extensions: [health_check, file_storage]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, k8sattributes, attributes/privacy, transform/limits, filter/noise, batch]
          exporters: [otlphttp]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, resource, k8sattributes, attributes/privacy, transform/limits, filter/noise, batch]
          exporters: [otlphttp]
        metrics:
          receivers: [hostmetrics, kubeletstats, prometheus]
          processors: [memory_limiter, resource, k8sattributes, batch]
          exporters: [otlphttp]
      telemetry:
        logs:
          level: info
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
{{- end }}
