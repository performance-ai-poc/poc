{{- if .Values.analytics.enabled | default true }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability.fullname" . }}-analytics
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.analytics.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: analytics
          image: "{{ .Values.analytics.image.repository }}:{{ .Values.analytics.image.tag }}"
          imagePullPolicy: {{ .Values.analytics.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.analytics.service.port }}
              protocol: TCP
          env:
            - name: APP_ENV
              value: {{ .Values.analytics.env.appEnv | quote }}
            - name: HOST
              value: {{ .Values.analytics.env.host | quote }}
            - name: PORT
              value: {{ .Values.analytics.env.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.analytics.env.logLevel | quote }}
            - name: OPENOBSERVE_URL
              value: {{ .Values.analytics.env.openobserveUrl | default (printf "http://%s-openobserve:%v" (include "observability.fullname" .) .Values.openObserve.service.port) | quote }}
            - name: OPENOBSERVE_ORG
              value: {{ .Values.analytics.env.openobserveOrg | quote }}
            - name: OPENOBSERVE_STREAM
              value: {{ .Values.analytics.env.openobserveStream | quote }}
            - name: OPENOBSERVE_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "observability.fullname" . }}-analytics
                  key: OPENOBSERVE_AUTH
            - name: LIVE_WINDOW_MINUTES
              value: {{ .Values.analytics.env.liveWindowMinutes | quote }}
            - name: BASELINE_WINDOW_MINUTES
              value: {{ .Values.analytics.env.baselineWindowMinutes | quote }}
            - name: COLLECTOR_MEMORY_LIMIT_MIB
              value: {{ .Values.analytics.env.collectorMemoryLimitMib | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.analytics.env.corsAllowedOrigins | quote }}
          resources:
            {{- toYaml .Values.analytics.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
{{- end }}
