# Local stack: Postgres 16 + FastMCP + the hardened OTel Collector + OpenObserve.
#
#   docker compose up --build
#
# mcp-server seeds the DB deterministically then serves 7 tools over
# streamable-http on :8000, exporting OTLP telemetry to the Collector. The
# Collector runs the SAME hardened config as Kubernetes (otel/collector-config.yaml:
# redaction, capture policy, allowlist) and exports to OpenObserve, browsable at
# http://localhost:5080. Stopping the Collector or OpenObserve never affects the
# app (fail-open, C2). For the full app path incl. the orchestrator + UIs, use
# the Helm chart (make dev); this compose is the data-plane + telemetry subset.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - mcp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 12

  mcp-server:
    build: ./mcp-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Read-write DSN — used ONLY by seeding.
      DATABASE_URL: postgresql://app:app@postgres:5432/appdb
      # Read-only DSN — used by the tools (run_query / search_documents). The
      # mcp_readonly role is created + granted SELECT-only by build_seed.py.
      READONLY_DATABASE_URL: postgresql://mcp_readonly:mcp_readonly@postgres:5432/appdb
      STATEMENT_TIMEOUT_MS: "3000"
      MOCK_TOOL_LATENCY_MS: "0"
      LOG_LEVEL: "INFO"
      OTEL_SERVICE_NAME: mcp-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    # Seed (idempotent) then serve over streamable-http.
    command: ["sh", "-c", "python -m app.seed.build_seed && python -m app.server"]
    ports:
      - "8000:8000"

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.14.1
    environment:
      ZO_ROOT_USER_EMAIL: admin@example-test.invalid
      ZO_ROOT_USER_PASSWORD: otel-poc-local-only
      ZO_DATA_DIR: /data
    ports:
      - "5080:5080"
    volumes:
      - openobserve_data:/data
    # No healthcheck: the OpenObserve image is distroless (no shell/wget/curl),
    # so a command-based compose healthcheck can't run. The Collector below
    # depends only on this container having STARTED, not on readiness — its
    # export queue + retry absorb a not-yet-ready backend (fail-open, C2).
    # (The Kubernetes path uses httpGet probes on /healthz, which need no
    # in-container tool, so it is unaffected.)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/collector-config.yaml"]
    # Compose-only: the named volume for the persistent queue (/var/lib/otelcol)
    # is created root-owned, and the image's default non-root user can't write
    # it. The Kubernetes path handles this properly with fsGroup on an emptyDir,
    # so this override is not needed there.
    user: "0:0"
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/collector-config.yaml:ro
      # Bounded, writable — file offsets + persistent export queue only (C5).
      - otelcol_storage:/var/lib/otelcol
    environment:
      DEPLOYMENT_ENVIRONMENT: local-compose
      OPENOBSERVE_ORG: default
      # Base64("admin@example-test.invalid:otel-poc-local-only").
      OPENOBSERVE_AUTH_HEADER: "Basic YWRtaW5AZXhhbXBsZS10ZXN0LmludmFsaWQ6b3RlbC1wb2MtbG9jYWwtb25seQ=="
      # Overridable for the policy-switch demo:
      #   CAPTURE_MODE=content-approved docker compose up -d --force-recreate otel-collector
      CAPTURE_MODE: ${CAPTURE_MODE:-metadata-only}
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      openobserve:
        condition: service_started

volumes:
  mcp_pgdata:
  openobserve_data:
  otelcol_storage:
