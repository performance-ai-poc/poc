server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Real-time dashboard WebSocket. Longer prefix than /api/analytics/, so it
    # wins for /api/analytics/ws/* and carries the connection-upgrade headers a
    # WebSocket needs. Maps to the analytics service's /ws/* endpoints.
    location /api/analytics/ws/ {
        proxy_pass http://observability-analytics:8002/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;   # keep the socket open through quiet periods
    }

    # Drift/analytics plane. Longer prefix than /api/, so nginx routes
    # /api/analytics/* here (to :8002/*) and everything else /api/* to the
    # orchestrator below.
    location /api/analytics/ {
        proxy_pass http://observability-analytics:8002/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://demo-ai-chat-orchestrator:8001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
